<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Follow Official</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Prompt',sans-serif;
  text-align:center;
  overflow:hidden;

  background: linear-gradient(135deg,#ffd6ec,#d6f0ff,#e6d6ff);
}

/* 🎀 กล่องหลัก */
.box{
  background:white;
  padding:30px;
  border-radius:25px;

  box-shadow:
    0 20px 60px rgba(255,182,193,0.5),
    0 0 40px rgba(255,105,180,0.3);
}

/* 💖 โลโก้ */
.logo{
  font-size:22px;
  font-weight:800;
  color:#ff4da6;
  animation:blink 1s infinite alternate;
}

/* 💎 โปร */
.title{
  font-size:28px;
  font-weight:900;
  margin-top:5px;

  background: linear-gradient(135deg,#ff6ec4,#ff9ad5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 🔥 urgency */
.urgent{
  margin-top:10px;
  font-size:14px;
  color:#ff2e88;
  font-weight:bold;
  animation:pulse 1s infinite;
}

/* ⏳ countdown */
.count{
  font-size:18px;
  margin-top:10px;
}

/* 👥 social proof */
.people{
  margin-top:10px;
  font-size:13px;
  color:#666;
}

/* 🎁 ไอคอน */
.gift{
  font-size:45px;
  margin-top:10px;
  animation:bounce 1s infinite;
}

/* ปุ่ม */
.btn{
  display:block;
  margin-top:20px;
  padding:15px;

  background:#06c755;
  color:white;

  border-radius:15px;
  text-decoration:none;
  font-weight:bold;

  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* anim */
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

@keyframes blink{
  from{opacity:1;}
  to{opacity:0.6;}
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">🎀 Friend Follow Official 🎀</div>

  <div class="title">Promotion 2569</div>

  <div class="gift">🎁</div>

  <div class="urgent">
    🔥 เหลือสิทธิ์ไม่มากแล้ว!
  </div>

  <div class="count">
    ⏳ กำลังเข้าสู่โปรโมชั่นใน <span id="time">3</span> วิ
  </div>

  <div class="people" id="people">
    👥 มีผู้สนใจ 12 คนตอนนี้
  </div>

  <a class="btn" href="https://script.google.com/macros/s/AKfycbz5Q9lhnCEOONKLjK0FP651SBYqwKaMQ9nv6e1o7UEvsZofya-COv0lmIr2A3OxILsk/exec">
    เข้าไปดูโปรโมชั่นทันที
  </a>

</div>

<script>
/* countdown */
let t = 3;
const el = document.getElementById("time");

const timer = setInterval(()=>{
  t--;
  el.innerText = t;

  if(t <= 0){
    clearInterval(timer);
    window.location.href = "https://script.google.com/macros/s/AKfycbz5Q9lhnCEOONKLjK0FP651SBYqwKaMQ9nv6e1o7UEvsZofya-COv0lmIr2A3OxILsk/exec";
  }
},1000);

/* 👥 คนสนใจ random (ดูมีคนจริง) */
setInterval(()=>{
  let n = Math.floor(Math.random()*10)+10;
  document.getElementById("people").innerText = "👥 มีผู้สนใจ "+n+" คนตอนนี้";
},3000);
</script>

</body>
</html>
