<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Follow Official</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Prompt',sans-serif;
  text-align:center;
  overflow:hidden;

  background: linear-gradient(135deg,#ffd6ec,#d6f0ff,#e6d6ff);
}

/* 🌈 พื้นหลังฟุ้ง */
body::before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  background:#ffb6d9;
  filter:blur(120px);
  top:10%;
  left:20%;
}

body::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  background:#b6e0ff;
  filter:blur(120px);
  bottom:10%;
  right:20%;
}

/* 🎀 กล่อง */
.box{
  position:relative;
  z-index:1;

  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(10px);

  padding:35px;
  border-radius:25px;

  box-shadow:
    0 20px 60px rgba(255,182,193,0.4),
    0 0 30px rgba(255,105,180,0.2);
}

/* 💖 โลโก้ */
.logo{
  font-size:22px;
  font-weight:700;
  color:#ff4da6;

  text-shadow:0 0 10px rgba(255,105,180,0.5);

  animation:softBlink 1.5s infinite alternate;
}

/* 💎 โปร */
.title{
  margin-top:8px;
  font-size:30px;
  font-weight:900;

  background: linear-gradient(90deg,#ff6ec4,#ff9ad5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* 🎁 ไอคอน */
.gift{
  font-size:45px;
  margin-top:12px;
  animation:float 2s infinite ease-in-out;
}

/* ⏳ */
.count{
  margin-top:10px;
  font-size:15px;
  color:#666;
}

/* 🔘 ปุ่ม */
.btn{
  display:block;
  margin-top:20px;
  padding:14px;

  background: linear-gradient(90deg,#ff6ec4,#ff9ad5);
  color:white;

  border-radius:15px;
  text-decoration:none;
  font-weight:bold;

  box-shadow:0 10px 20px rgba(255,105,180,0.3);
}

/* anim */
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

@keyframes softBlink{
  from{opacity:1;}
  to{opacity:0.7;}
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">Friend Follow Official</div>

  <div class="title">Promotion 2569</div>

  <div class="gift">🎁</div>

  <div class="count">
    กำลังเข้าสู่โปรโมชั่น...
  </div>

  <a class="btn" href="https://script.google.com/macros/s/AKfycbz5Q9lhnCEOONKLjK0FP651SBYqwKaMQ9nv6e1o7UEvsZofya-COv0lmIr2A3OxILsk/exec">
    เข้าหน้าโปรโมชั่น
  </a>

</div>

<script>
setTimeout(()=>{
  window.location.href="https://script.google.com/macros/s/AKfycbz5Q9lhnCEOONKLjK0FP651SBYqwKaMQ9nv6e1o7UEvsZofya-COv0lmIr2A3OxILsk/exec";
},2500);
</script>

</body>
</html>
