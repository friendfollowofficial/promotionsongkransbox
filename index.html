<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Follow Official</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Prompt',sans-serif;
  text-align:center;
  overflow:hidden;
  background: linear-gradient(135deg,#ffd6ec,#ffe3f7,#f3d6ff);
}

/* 💖 หัวใจลอย */
.heart{
  position:absolute;
  font-size:18px;
  opacity:0.6;
  animation:floatUp 8s linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* 🫧 ฟอง */
.bubble{
  position:absolute;
  border-radius:50%;
  background:rgba(255,182,193,0.25);
  animation:floatUp 10s linear infinite;
}

/* 🎀 กล่อง */
.box{
  position:relative;
  z-index:2;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(12px);
  padding:35px;
  border-radius:30px;
  box-shadow:
    0 20px 60px rgba(255,182,193,0.6),
    0 0 40px rgba(255,105,180,0.4);
  animation:popBox 1s ease;
}

/* 💎 โลโก้ */
.logo{
  font-size:22px;
  font-weight:800;
  color:#ff4da6;
  text-shadow:0 0 10px rgba(255,105,180,0.7);
  animation:blink 1.2s infinite alternate;
}

/* 🌈 title */
.title{
  margin-top:10px;
  font-size:30px;
  font-weight:900;
  background: linear-gradient(90deg,#ff6ec4,#ff9ad5,#ff6ec4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation:pop 1s infinite alternate;
}

/* 🎁 */
.gift{
  font-size:55px;
  margin-top:15px;
  animation:bounce 1.2s infinite;
}

/* ✨ sparkle */
.sparkle{
  position:absolute;
  top:-10px;
  right:-10px;
  font-size:18px;
  animation:twinkle 1s infinite alternate;
}

/* 💬 loading */
.loading{
  margin-top:10px;
  font-size:14px;
  color:#888;
}

/* 💫 dots */
.dots span{
  display:inline-block;
  width:8px;
  height:8px;
  margin:3px;
  background:#ff6ec4;
  border-radius:50%;
  animation:dot 1s infinite;
}

.dots span:nth-child(2){animation-delay:0.2s;}
.dots span:nth-child(3){animation-delay:0.4s;}

/* 🎀 ปุ่ม */
.btn{
  display:block;
  margin-top:20px;
  padding:14px;
  background: linear-gradient(90deg,#ff6ec4,#ff9ad5);
  color:white;
  border-radius:20px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 10px 20px rgba(255,105,180,0.5);
  animation:pulse 1.5s infinite;
}

/* anim */
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

@keyframes blink{
  from{opacity:1;}
  to{opacity:0.6;}
}

@keyframes pop{
  from{transform:scale(1);}
  to{transform:scale(1.05);}
}

@keyframes dot{
  0%,100%{opacity:0.3;}
  50%{opacity:1;}
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

@keyframes twinkle{
  from{opacity:0.3;}
  to{opacity:1;}
}

@keyframes popBox{
  from{transform:scale(0.8); opacity:0;}
  to{transform:scale(1); opacity:1;}
}
</style>
</head>

<body>

<!-- 💖 หัวใจ -->
<div class="heart" style="left:10%">💖</div>
<div class="heart" style="left:30%">💗</div>
<div class="heart" style="left:60%">💓</div>
<div class="heart" style="left:80%">💞</div>

<!-- 🫧 ฟอง -->
<div class="bubble" style="width:80px;height:80px;left:20%"></div>
<div class="bubble" style="width:60px;height:60px;left:50%"></div>
<div class="bubble" style="width:100px;height:100px;left:75%"></div>

<div class="box">

  <!-- 🔊 เสียง -->
  <audio id="bgSound" loop preload="auto">
    <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
  </audio>

  <div class="sparkle">✨</div>

  <div class="logo">🎀 Friend Follow Official 🎀</div>

  <div class="title">Promotion 2569</div>

  <div class="gift">🎁</div>

  <div class="loading">
    กำลังโหลดโปรโมชั่น
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <a class="btn" href="https://script.google.com/macros/s/AKfycbz5Q9lhnCEOONKLjK0FP651SBYqwKaMQ9nv6e1o7UEvsZofya-COv0lmIr2A3OxILsk/exec">
    เข้าไปดูโปรโมชั่น 💖
  </a>

</div>

<script>
let started = false;

function startSound(){
  if(started) return;
  started = true;

  const audio = document.getElementById("bgSound");
  audio.volume = 0.3;
  audio.play().catch(()=>{});
}

/* รองรับมือถือ */
window.addEventListener("click", startSound);

/* เล่นทันทีถ้าได้ */
window.onload = startSound;

/* โหลดเสร็จ → หยุดเสียง → ไปหน้าโปร */
setTimeout(()=>{
  const audio = document.getElementById("bgSound");
  audio.pause();

  window.location.href="https://script.google.com/macros/s/AKfycbz5Q9lhnCEOONKLjK0FP651SBYqwKaMQ9nv6e1o7UEvsZofya-COv0lmIr2A3OxILsk/exec";
},3000);
</script>

</body>
</html>
